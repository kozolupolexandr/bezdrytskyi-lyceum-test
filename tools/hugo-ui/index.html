<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src * data: blob:" />
  <title>Hugo UI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      display: flex;
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
    }

    /* ─── Sidebar ─────────────────────────────── */

    #sidebar {
      width: 240px;
      min-width: 240px;
      background: #181825;
      border-right: 1px solid #313244;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 10px 12px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6c7086;
      border-bottom: 1px solid #313244;
      flex-shrink: 0;
    }

    #sidebar-toolbar {
      display: flex;
      gap: 5px;
      padding: 7px 8px;
      border-bottom: 1px solid #313244;
      flex-shrink: 0;
    }

    .tb-btn {
      flex: 1;
      background: #313244;
      border: none;
      color: #cdd6f4;
      padding: 5px 4px;
      border-radius: 5px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      white-space: nowrap;
    }
    .tb-btn:hover    { background: #45475a; }
    .tb-btn:disabled { opacity: 0.4; cursor: default; }
    .tb-btn.tb-active { background: #a6e3a1; color: #1e1e2e; }

    #hugo-status {
      display: none;
      padding: 4px 10px;
      font-size: 11px;
      color: #a6e3a1;
      border-bottom: 1px solid #313244;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }
    #hugo-status.visible { display: flex; }
    #hugo-open-link { color: #89b4fa; cursor: pointer; text-decoration: underline; }

    #toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #313244;
      color: #cdd6f4;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 3000;
      max-width: 380px;
      text-align: center;
      white-space: pre-line;
    }
    #toast.show       { opacity: 1; }
    #toast.toast-ok   { border-left: 3px solid #a6e3a1; }
    #toast.toast-error { border-left: 3px solid #f38ba8; }

    #sidebar-scroll {
      overflow-y: auto;
      flex: 1;
      padding: 6px 0;
    }

    /* ─── Tree ────────────────────────────────── */

    .tree-root { padding: 0 0 4px 8px; }

    .tree-node { position: relative; }

    .tree-children {
      position: relative;
      padding-left: 16px;
      margin-left: 8px;
      border-left: 1px solid #313244;
    }

    .tree-row::before {
      content: '';
      position: absolute;
      left: -16px;
      top: 50%;
      width: 12px;
      height: 1px;
      background: #313244;
    }

    .tree-row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px 4px 4px;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tree-row:hover { background: #252535; }
    .tree-root > .tree-node > .tree-row::before { display: none; }
    .tree-icon { flex-shrink: 0; font-size: 13px; }
    .tree-label { overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .tree-row.is-dir .tree-label { color: #89b4fa; font-weight: 500; }
    .tree-row.is-file .tree-label { color: #cdd6f4; }
    .tree-row.active { background: #313244; }
    .tree-row.active .tree-label { color: #cba6f7; }
    .tree-row.unsaved .tree-label::after { content: ' ●'; color: #fab387; }
    .tree-node.collapsed > .tree-children { display: none; }

    .tree-arrow {
      font-size: 9px;
      color: #6c7086;
      flex-shrink: 0;
      transition: transform 0.15s;
    }
    .tree-node.collapsed > .tree-row .tree-arrow { transform: rotate(-90deg); }

    /* + button on dir rows */
    .tree-add-btn {
      display: none;
      flex-shrink: 0;
      background: none;
      border: none;
      color: #6c7086;
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
      cursor: pointer;
      border-radius: 3px;
    }
    .tree-row .tree-add-btn { display: block; }
    .tree-add-btn:hover { color: #cba6f7; background: #45475a; }
    .tree-del-btn {
      display: none;
      flex-shrink: 0;
      background: none;
      border: none;
      color: #6c7086;
      font-size: 14px;
      line-height: 1;
      padding: 0 3px;
      cursor: pointer;
      border-radius: 3px;
    }
    .tree-row.is-file:hover .tree-del-btn { display: block; }
    .tree-del-btn:hover { color: #f38ba8; background: #45475a; }

    /* inline new-file input */
    .new-file-row {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 4px;
    }

    .new-file-input {
      flex: 1;
      background: #181825;
      border: 1px solid #cba6f7;
      border-radius: 4px;
      color: #cdd6f4;
      font-size: 12px;
      padding: 3px 7px;
      outline: none;
    }

    /* ─── Main ────────────────────────────────── */

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #181825;
    }

    #topbar {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #313244;
      background: #181825;
      flex-shrink: 0;
    }

    #file-path {
      color: #6c7086;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #file-path span { color: #cba6f7; }

    #bar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    #save-status { font-size: 11px; color: #a6e3a1; opacity: 0; transition: opacity 0.4s; }
    #save-status.show { opacity: 1; }

    #save-btn {
      background: #313244;
      border: none;
      color: #cdd6f4;
      padding: 4px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
    }
    #save-btn:hover { background: #45475a; }
    #save-btn:disabled { opacity: 0.3; cursor: default; }

    /* ─── Page wrap ───────────────────────────── */

    #page-wrap {
      flex: 1;
      overflow-y: auto;
      display: flex;
      justify-content: center;
      padding: 28px 24px;
      background: #13131f;
    }

    #page {
      width: 100%;
      max-width: 820px;
      background: #1e1e2e;
      border-radius: 6px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }

    /* ─── Front matter form ───────────────────── */

    #fm-panel {
      display: none;
      padding: 20px 28px 16px;
      border-bottom: 1px solid #313244;
      gap: 14px 20px;
      flex-wrap: wrap;
    }

    #fm-panel.visible { display: flex; }

    .fm-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 160px;
    }

    .fm-field.wide { flex: 1 1 100%; }
    .fm-field.half { flex: 1 1 calc(50% - 10px); }
    .fm-field.auto { flex: 0 0 auto; }

    .fm-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6c7086;
    }

    .fm-label .required { color: #f38ba8; margin-left: 2px; }

    .fm-input {
      background: #181825;
      border: 1px solid #313244;
      border-radius: 5px;
      color: #cdd6f4;
      padding: 5px 9px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }
    .fm-input:focus { border-color: #cba6f7; }

    /* boolean toggle */
    .fm-toggle-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 4px;
    }

    .fm-toggle {
      appearance: none;
      width: 34px;
      height: 18px;
      background: #313244;
      border-radius: 9px;
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .fm-toggle::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      background: #6c7086;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: left 0.2s, background 0.2s;
    }
    .fm-toggle:checked { background: #cba6f7; }
    .fm-toggle:checked::after { left: 19px; background: #1e1e2e; }

    .fm-toggle-label { font-size: 13px; color: #cdd6f4; }

    /* array / tags */
    .fm-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      background: #181825;
      border: 1px solid #313244;
      border-radius: 5px;
      padding: 5px 8px;
      min-height: 34px;
      cursor: text;
      transition: border-color 0.15s;
    }
    .fm-tags:focus-within { border-color: #cba6f7; }

    .fm-tag {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #313244;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 12px;
      color: #cdd6f4;
    }

    .fm-tag-remove {
      background: none;
      border: none;
      color: #6c7086;
      cursor: pointer;
      font-size: 12px;
      padding: 0;
      line-height: 1;
    }
    .fm-tag-remove:hover { color: #f38ba8; }

    .fm-tag-input {
      background: none;
      border: none;
      outline: none;
      color: #cdd6f4;
      font-size: 13px;
      min-width: 80px;
      flex: 1;
    }

    /* ─── Context menu ───────────────────────── */

    #ctx-menu {
      display: none;
      position: fixed;
      z-index: 1000;
      background: #24273a;
      border: 1px solid #45475a;
      border-radius: 6px;
      padding: 4px 0;
      min-width: 210px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .ctx-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      color: #cdd6f4;
      user-select: none;
    }

    .ctx-item:hover { background: #313244; }
    .ctx-item .ctx-icon { font-size: 14px; width: 16px; text-align: center; }
    .ctx-separator { height: 1px; background: #313244; margin: 3px 0; }

    /* ─── Modal overlay ───────────────────────── */

    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }

    #modal-overlay.open { display: flex; }

    #modal {
      background: #1e1e2e;
      border: 1px solid #313244;
      border-radius: 8px;
      width: 560px;
      max-width: 90vw;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 48px rgba(0,0,0,0.6);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid #313244;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .modal-close {
      background: none;
      border: none;
      color: #6c7086;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .modal-close:hover { color: #cdd6f4; }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 18px;
      border-top: 1px solid #313244;
      flex-shrink: 0;
    }

    .modal-btn {
      padding: 6px 16px;
      border-radius: 5px;
      border: none;
      font-size: 13px;
      cursor: pointer;
    }

    .modal-btn-primary { background: #cba6f7; color: #1e1e2e; font-weight: 600; }
    .modal-btn-primary:hover { background: #b4befe; }
    .modal-btn-secondary { background: #313244; color: #cdd6f4; }
    .modal-btn-secondary:hover { background: #45475a; }

    /* ─── Modal field ─────────────────────────── */

    .mfield { display: flex; flex-direction: column; gap: 5px; }
    .mfield label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: #6c7086; }

    .minput {
      background: #181825;
      border: 1px solid #313244;
      border-radius: 5px;
      color: #cdd6f4;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
    }
    .minput:focus { border-color: #cba6f7; }

    /* ─── Picker list ─────────────────────────── */

    .picker-search {
      background: #181825;
      border: 1px solid #313244;
      border-radius: 5px;
      color: #cdd6f4;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      width: 100%;
    }
    .picker-search:focus { border-color: #cba6f7; }

    .picker-list {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #313244;
      border-radius: 5px;
      max-height: 260px;
    }

    .picker-item {
      padding: 7px 12px;
      cursor: pointer;
      font-size: 13px;
      border-bottom: 1px solid #181825;
    }
    .picker-item:hover { background: #313244; }
    .picker-item.selected { background: #45475a; color: #cba6f7; }
    .picker-item-title { color: #cdd6f4; }
    .picker-item-path { font-size: 11px; color: #6c7086; margin-top: 1px; }

    /* ─── Image grid ──────────────────────────── */

    .img-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 280px;
      overflow-y: auto;
      padding: 4px;
    }

    .img-grid-item {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      flex-shrink: 0;
    }

    .img-grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .img-grid-item:hover { border-color: #6c7086; }
    .img-grid-item.selected { border-color: #cba6f7; }

    .img-grid-item .img-check {
      display: none;
      position: absolute;
      top: 3px;
      right: 3px;
      background: #cba6f7;
      color: #1e1e2e;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 11px;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .img-grid-item.selected .img-check { display: flex; }

    .img-dir-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: #6c7086;
      padding: 4px 0 2px;
      width: 100%;
    }

    /* ─── Drop zone ──────────────────────────── */

    .drop-zone {
      border: 2px dashed #45475a;
      border-radius: 6px;
      padding: 8px 12px;
      text-align: center;
      color: #6c7086;
      font-size: 12px;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .drop-zone.drag-over {
      border-color: #cba6f7;
      color: #cba6f7;
      background: rgba(203,166,247,0.06);
    }
    .drop-zone select {
      background: #313244;
      border: 1px solid #45475a;
      color: #cdd6f4;
      font-size: 11px;
      border-radius: 4px;
      padding: 2px 6px;
      cursor: pointer;
    }

    /* carousel selected list */
    .carousel-selected { display: flex; flex-direction: column; gap: 6px; }

    .carousel-selected-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #181825;
      border-radius: 5px;
      padding: 5px 8px;
    }

    .carousel-selected-thumb {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .carousel-selected-name { font-size: 11px; color: #6c7086; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .carousel-caption-input {
      background: #24273a;
      border: 1px solid #313244;
      border-radius: 4px;
      color: #cdd6f4;
      padding: 4px 7px;
      font-size: 12px;
      outline: none;
      width: 140px;
      flex-shrink: 0;
    }
    .carousel-caption-input:focus { border-color: #cba6f7; }

    .carousel-remove {
      background: none;
      border: none;
      color: #6c7086;
      cursor: pointer;
      font-size: 14px;
      padding: 0;
      flex-shrink: 0;
    }
    .carousel-remove:hover { color: #f38ba8; }

    /* ─── Tag suggestions dropdown ───────────── */

    .tag-suggestions {
      position: absolute;
      background: #24273a;
      border: 1px solid #45475a;
      border-radius: 5px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      z-index: 100;
      min-width: 140px;
      max-height: 180px;
      overflow-y: auto;
    }

    .tag-suggestion-item {
      padding: 5px 10px;
      cursor: pointer;
      font-size: 12px;
      color: #cdd6f4;
    }

    .tag-suggestion-item:hover,
    .tag-suggestion-item.active { background: #313244; color: #cba6f7; }

    /* ─── Body editor ─────────────────────────── */

    #editor {
      flex: 1;
      background: transparent;
      color: #cdd6f4;
      border: none;
      outline: none;
      resize: none;
      padding: 28px 32px;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 14px;
      line-height: 1.7;
      tab-size: 2;
      min-height: 300px;
    }

    #placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #313244;
      font-size: 15px;
    }
  </style>
</head>
<body>

<nav id="sidebar">
  <div id="sidebar-header" title="">Провідник</div>
  <div id="sidebar-toolbar">
    <button class="tb-btn" id="btn-pull"   title="Завантажити зміни з Git (pull)">↓ Pull</button>
    <button class="tb-btn" id="btn-commit" title="Зберегти та відправити до Git (commit + push)">↑ Push</button>
    <button class="tb-btn" id="btn-hugo"   title="Запустити Hugo сервер для перегляду">▶ Hugo</button>
  </div>
  <div id="hugo-status">
    <span>● Hugo</span>
    <a id="hugo-open-link">localhost:1313</a>
  </div>
  <div id="sidebar-scroll">
    <div class="tree-root" id="tree-root"></div>
  </div>
</nav>

<div id="main">
  <div id="topbar">
    <div id="file-path">Оберіть файл</div>
    <div id="bar-right">
      <span id="save-status">Збережено</span>
      <button id="save-btn" disabled>Зберегти</button>
    </div>
  </div>

  <div id="page-wrap">
    <div id="page">
      <div id="placeholder">Оберіть .md файл зі списку</div>
      <div id="fm-panel"></div>
      <textarea id="editor" style="display:none" spellcheck="false"></textarea>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Context menu -->
<div id="ctx-menu">
  <div class="ctx-item" data-action="internal-link"><span class="ctx-icon">📄</span> Посилання на сторінку сайту</div>
  <div class="ctx-item" data-action="external-link"><span class="ctx-icon">🔗</span> Посилання на зовнішній сайт</div>
  <div class="ctx-item" data-action="doc-link"><span class="ctx-icon">📎</span> Посилання на документ</div>
  <div class="ctx-separator"></div>
  <div class="ctx-item" data-action="image"><span class="ctx-icon">🖼</span> Зображення</div>
  <div class="ctx-item" data-action="carousel"><span class="ctx-icon">🎠</span> Карусель зображень</div>
</div>

<!-- Modal overlay -->
<div id="modal-overlay">
  <div id="modal">
    <div class="modal-header">
      <span id="modal-title"></span>
      <button class="modal-close" id="modal-close-btn">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button class="modal-btn modal-btn-secondary" id="modal-cancel-btn">Скасувати</button>
      <button class="modal-btn modal-btn-primary" id="modal-insert-btn">Вставити</button>
    </div>
  </div>
</div>

<script>
  // Forward errors to log file
  window.onerror = (msg, src, line, col, err) =>
    window.api.log('ERROR', `${msg} (${src}:${line}:${col})`, err?.stack || '')
  window.onunhandledrejection = e =>
    window.api.log('ERROR', 'unhandledRejection', String(e.reason))
  const _origError = console.error.bind(console)
  console.error = (...a) => { _origError(...a); window.api.log('ERROR', ...a.map(String)) }

  let currentPath      = null
  let dirty            = false
  let activeRow        = null
  let schema           = []
  let hiddenValues     = {}
  const suggestionsCache = {}  // dirPath → suggestions

  const editor      = document.getElementById('editor')
  const saveBtn     = document.getElementById('save-btn')
  const saveStatus  = document.getElementById('save-status')
  const filePathEl  = document.getElementById('file-path')
  const placeholder = document.getElementById('placeholder')
  const treeRoot    = document.getElementById('tree-root')
  const fmPanel     = document.getElementById('fm-panel')

  // ── Tree ───────────────────────────────────────────────

  function renderNode(node, container, isRoot) {
    const wrapper = document.createElement('div')
    wrapper.className = 'tree-node'
    const row = document.createElement('div')

    if (node.type === 'dir' || isRoot) {
      row.className = 'tree-row is-dir'
      row.innerHTML = `
        <span class="tree-arrow">▾</span>
        <span class="tree-icon">📁</span>
        <span class="tree-label" title="${node.path}">${node.name}</span>
        <button class="tree-add-btn" title="Новий файл">+</button>
      `
      const childrenEl = document.createElement('div')
      childrenEl.className = 'tree-children'

      // toggle collapse (ignore clicks on + button)
      row.addEventListener('click', e => {
        if (e.target.classList.contains('tree-add-btn')) return
        wrapper.classList.toggle('collapsed')
        row.querySelector('.tree-icon').textContent =
          wrapper.classList.contains('collapsed') ? '📁' : '📂'
      })

      // + button → show inline input
      row.querySelector('.tree-add-btn').addEventListener('click', e => {
        e.stopPropagation()
        // expand if collapsed
        wrapper.classList.remove('collapsed')
        row.querySelector('.tree-icon').textContent = '📂'
        showNewFileInput(node.path, childrenEl)
      })

      for (const child of node.children) renderNode(child, childrenEl, false)

      if (node.children.length === 0) {
        const empty = document.createElement('div')
        empty.className = 'tree-empty'
        empty.style.cssText = 'padding:3px 4px;color:#45475a;font-size:11px;'
        empty.textContent = 'порожньо'
        childrenEl.appendChild(empty)
      }

      wrapper.appendChild(row)
      wrapper.appendChild(childrenEl)
    } else {
      row.className = 'tree-row is-file'
      row.innerHTML = `
        <span class="tree-icon">📄</span>
        <span class="tree-label" title="${node.path}">${node.name}</span>
        <button class="tree-del-btn" title="Видалити файл">×</button>
      `
      row.addEventListener('click', e => {
        if (e.target.classList.contains('tree-del-btn')) return
        openFile(node.path, row)
      })
      row.querySelector('.tree-del-btn').addEventListener('click', e => {
        e.stopPropagation()
        deleteFile(node.path, node.name)
      })
      wrapper.appendChild(row)
    }

    container.appendChild(wrapper)
  }

  async function buildTree(openPath) {
    const roots = await window.api.getTree()
    treeRoot.innerHTML = ''
    for (const root of roots) renderNode(root, treeRoot, true)
    // re-open file if given
    if (openPath) {
      const row = [...treeRoot.querySelectorAll('.tree-row.is-file')]
        .find(r => r.querySelector('.tree-label').title === openPath)
      if (row) row.click()
    }
  }

  async function showNewFileInput(dirPath, childrenEl) {
    if (childrenEl.querySelector('.new-file-row')) return

    const row = document.createElement('div')
    row.className = 'new-file-row'
    row.innerHTML = `<span style="font-size:13px">📄</span>`

    const input = document.createElement('input')
    input.className = 'new-file-input'
    input.placeholder = 'назва-файлу.md'
    row.appendChild(input)
    childrenEl.prepend(row)

    // pre-fill with pattern-generated name
    const { name: suggested } = await window.api.nextFileName(dirPath)
    input.value = suggested || ''
    input.focus()
    // select the number part so user can quickly change it
    if (suggested) {
      const dotIdx = suggested.lastIndexOf('.')
      input.setSelectionRange(0, dotIdx > 0 ? dotIdx : suggested.length)
    }

    const cancel = () => row.remove()

    const confirm = async () => {
      const name = input.value.trim()
      if (!name) { cancel(); return }
      const result = await window.api.createFile(dirPath, name)
      if (result.error) { alert('Помилка: ' + result.error); return }
      await buildTree(result.path)
    }

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter')  { e.preventDefault(); confirm() }
      if (e.key === 'Escape') { e.preventDefault(); cancel() }
    })
    input.addEventListener('blur', () => setTimeout(cancel, 150))
  }

  // ── Front matter form ──────────────────────────────────

  function today() {
    return new Date().toISOString().slice(0, 10)
  }

  function resolveDefault(field) {
    if (field.default === 'today') return today()
    if (field.default !== undefined) return field.default
    if (field.type === 'boolean') return false
    if (field.type === 'array')   return []
    return ''
  }

  function buildForm(values, suggestions = {}) {
    fmPanel.innerHTML = ''
    fmPanel.classList.add('visible')

    for (const field of schema) {
      if (field.hidden) continue

      const val = values[field.name] !== undefined
        ? values[field.name]
        : resolveDefault(field)

      const fieldSuggestions = suggestions[field.name] || []
      const wrap = document.createElement('div')
      const labelHtml = `<span class="fm-label">${field.name}${field.required ? '<span class="required">*</span>' : ''}</span>`

      if (field.type === 'boolean') {
        wrap.className = 'fm-field auto'
        wrap.innerHTML = labelHtml
        const toggleWrap = document.createElement('div')
        toggleWrap.className = 'fm-toggle-wrap'
        const cb = document.createElement('input')
        cb.type = 'checkbox'
        cb.className = 'fm-toggle'
        cb.checked = Boolean(val)
        cb.dataset.field = field.name
        const lbl = document.createElement('span')
        lbl.className = 'fm-toggle-label'
        lbl.textContent = cb.checked ? 'так' : 'ні'
        cb.addEventListener('change', () => { lbl.textContent = cb.checked ? 'так' : 'ні'; setDirty(true) })
        toggleWrap.appendChild(cb)
        toggleWrap.appendChild(lbl)
        wrap.appendChild(toggleWrap)

      } else if (field.type === 'array') {
        wrap.className = 'fm-field wide'
        wrap.innerHTML = labelHtml
        const tagsWrap = document.createElement('div')
        tagsWrap.className = 'fm-tags'
        tagsWrap.style.position = 'relative'
        tagsWrap.dataset.field = field.name

        const addTag = (text, markDirty = true) => {
          if (!text.trim()) return
          const tag = document.createElement('span')
          tag.className = 'fm-tag'
          tag.innerHTML = `${text}<button class="fm-tag-remove" title="Видалити">×</button>`
          tag.querySelector('.fm-tag-remove').addEventListener('click', () => { tag.remove(); setDirty(true) })
          tagsWrap.insertBefore(tag, tagInput)
          if (markDirty) setDirty(true)
        }

        // suggestions dropdown for tags
        let dropdownEl = null
        let activeIdx = -1

        const closeDropdown = () => { dropdownEl?.remove(); dropdownEl = null; activeIdx = -1 }

        const openDropdown = (items) => {
          closeDropdown()
          if (!items.length) return
          dropdownEl = document.createElement('div')
          dropdownEl.className = 'tag-suggestions'
          dropdownEl.style.cssText = 'position:absolute;top:calc(100% + 4px);left:0;right:0;'
          items.forEach((item, i) => {
            const opt = document.createElement('div')
            opt.className = 'tag-suggestion-item'
            opt.textContent = item
            opt.addEventListener('mousedown', e => {
              e.preventDefault()
              addTag(item)
              tagInput.value = ''
              closeDropdown()
              tagInput.focus()
            })
            dropdownEl.appendChild(opt)
          })
          tagsWrap.appendChild(dropdownEl)
        }

        const tagInput = document.createElement('input')
        tagInput.className = 'fm-tag-input'
        tagInput.placeholder = fieldSuggestions.length ? 'Вибрати або ввести...' : 'Додати...'

        tagInput.addEventListener('input', () => {
          const q = tagInput.value.trim().toLowerCase()
          const existing = [...tagsWrap.querySelectorAll('.fm-tag')].map(t => t.childNodes[0].textContent.trim())
          const filtered = fieldSuggestions.filter(s =>
            s.toLowerCase().includes(q) && !existing.includes(s)
          )
          q ? openDropdown(filtered) : closeDropdown()
        })

        tagInput.addEventListener('focus', () => {
          const existing = [...tagsWrap.querySelectorAll('.fm-tag')].map(t => t.childNodes[0].textContent.trim())
          const available = fieldSuggestions.filter(s => !existing.includes(s))
          if (available.length && !tagInput.value) openDropdown(available)
        })

        tagInput.addEventListener('keydown', e => {
          if (dropdownEl) {
            const items = dropdownEl.querySelectorAll('.tag-suggestion-item')
            if (e.key === 'ArrowDown') {
              e.preventDefault()
              activeIdx = Math.min(activeIdx + 1, items.length - 1)
              items.forEach((el, i) => el.classList.toggle('active', i === activeIdx))
              return
            }
            if (e.key === 'ArrowUp') {
              e.preventDefault()
              activeIdx = Math.max(activeIdx - 1, 0)
              items.forEach((el, i) => el.classList.toggle('active', i === activeIdx))
              return
            }
            if (e.key === 'Enter' && activeIdx >= 0) {
              e.preventDefault()
              addTag(items[activeIdx].textContent)
              tagInput.value = ''
              closeDropdown()
              return
            }
            if (e.key === 'Escape') { closeDropdown(); return }
          }
          if (e.key === 'Enter' || e.key === ',') {
            e.preventDefault()
            addTag(tagInput.value.replace(/,$/, '').trim())
            tagInput.value = ''
            closeDropdown()
          } else if (e.key === 'Backspace' && !tagInput.value) {
            const tags = tagsWrap.querySelectorAll('.fm-tag')
            if (tags.length) { tags[tags.length - 1].remove(); setDirty(true) }
          }
        })

        tagInput.addEventListener('blur', () => {
          setTimeout(() => {
            if (tagInput.value.trim()) { addTag(tagInput.value.trim()); tagInput.value = '' }
            closeDropdown()
          }, 150)
        })

        tagsWrap.addEventListener('click', e => { if (!e.target.closest('.fm-tag')) tagInput.focus() })
        tagsWrap.appendChild(tagInput)
        ;(Array.isArray(val) ? val : []).forEach(t => addTag(t, false))
        wrap.appendChild(tagsWrap)

      } else {
        // string or date
        const isDate = field.type === 'date'
        wrap.className = `fm-field ${isDate ? 'auto' : 'half'}`
        wrap.innerHTML = labelHtml
        const input = document.createElement('input')
        input.type = isDate ? 'date' : 'text'
        input.className = 'fm-input'
        input.dataset.field = field.name
        input.value = isDate ? String(val).slice(0, 10) : (val || '')
        input.addEventListener('input', () => setDirty(true))

        // datalist for string suggestions
        if (!isDate && fieldSuggestions.length) {
          const listId = `dl-${field.name}-${Date.now()}`
          input.setAttribute('list', listId)
          const dl = document.createElement('datalist')
          dl.id = listId
          fieldSuggestions.forEach(s => {
            const opt = document.createElement('option')
            opt.value = s
            dl.appendChild(opt)
          })
          wrap.appendChild(dl)
        }

        wrap.appendChild(input)
      }

      fmPanel.appendChild(wrap)
    }
  }

  function collectFrontMatter() {
    const fm = { ...hiddenValues }

    // resolve hidden fields with default "today"
    for (const field of schema) {
      if (!field.hidden) continue
      if (fm[field.name] === undefined || field.default === 'today') {
        fm[field.name] = resolveDefault(field)
      }
    }

    for (const field of schema) {
      if (field.hidden) continue

      if (field.type === 'boolean') {
        const el = fmPanel.querySelector(`input[data-field="${field.name}"]`)
        if (el) fm[field.name] = el.checked

      } else if (field.type === 'array') {
        const wrap = fmPanel.querySelector(`[data-field="${field.name}"]`)
        if (wrap) {
          fm[field.name] = [...wrap.querySelectorAll('.fm-tag')].map(t =>
            t.childNodes[0].textContent.trim()
          )
        }

      } else {
        const el = fmPanel.querySelector(`input[data-field="${field.name}"]`)
        if (el) fm[field.name] = el.value
      }
    }

    return fm
  }

  // ── File operations ────────────────────────────────────

  async function openFile(fp, row) {
    if (dirty && currentPath) {
      const ok = confirm('Є незбережені зміни. Відкрити без збереження?')
      if (!ok) return
    }

    const result = await window.api.readFile(fp)
    if (result.error) { alert('Помилка: ' + result.error); return }

    schema = await window.api.getSchema(fp)

    // load suggestions (cached per directory)
    const dirPath = fp.replace(/\\/g, '/').split('/').slice(0, -1).join('/')
    if (!suggestionsCache[dirPath]) {
      suggestionsCache[dirPath] = await window.api.getSuggestions(dirPath)
    }
    const suggestions = suggestionsCache[dirPath]

    currentPath = fp
    setDirty(false)

    if (activeRow) activeRow.classList.remove('active')
    activeRow = row
    row.classList.add('active')

    const parts = fp.replace(/\\/g, '/').split('/')
    const name  = parts.pop()
    filePathEl.innerHTML = `<span>${name}</span> &nbsp;—&nbsp; ${parts.join('/')}`

    // store hidden field values from file
    hiddenValues = {}
    for (const field of schema) {
      if (field.hidden && result.frontMatter[field.name] !== undefined) {
        hiddenValues[field.name] = result.frontMatter[field.name]
      }
    }

    buildForm(result.frontMatter, suggestions)

    placeholder.style.display = 'none'
    editor.style.display = 'block'
    editor.value = result.body || ''
    saveBtn.disabled = false
  }

  async function saveFile() {
    if (!currentPath) return
    const fm = collectFrontMatter()
    const result = await window.api.writeFile(currentPath, fm, editor.value)
    if (result.error) { alert('Помилка збереження: ' + result.error); return }
    setDirty(false)
    saveStatus.classList.add('show')
    setTimeout(() => saveStatus.classList.remove('show'), 1800)
  }

  function setDirty(val) {
    dirty = val
    if (activeRow) activeRow.classList.toggle('unsaved', val)
  }

  async function deleteFile(filePath, fileName) {
    if (!confirm(`Видалити файл «${fileName}»?\nЦю дію не можна скасувати.`)) return
    const res = await window.api.deleteFile(filePath)
    if (res.error) { showToast('Помилка видалення:\n' + res.error, 'error'); return }
    if (currentPath === filePath) {
      currentPath = null
      activeRow   = null
      setDirty(false)
      editor.value = ''
      placeholder.style.display = 'flex'
      editor.style.display = 'none'
      saveBtn.disabled = true
      filePathEl.textContent = ''
      buildForm({}, {})
    }
    buildTree()
    showToast(`Файл «${fileName}» видалено`, 'ok')
  }

  // ── Events ─────────────────────────────────────────────

  editor.addEventListener('input', () => { if (!dirty) setDirty(true) })
  editor.addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 's') { e.preventDefault(); saveFile() }
    if (e.key === 'Tab') {
      e.preventDefault()
      const s = editor.selectionStart
      editor.value = editor.value.slice(0, s) + '  ' + editor.value.slice(editor.selectionEnd)
      editor.selectionStart = editor.selectionEnd = s + 2
    }
  })
  saveBtn.addEventListener('click', saveFile)

  // ── Insert at cursor ───────────────────────────────────

  function insertAtCursor(text) {
    const s = editor.selectionStart
    const e = editor.selectionEnd
    editor.value = editor.value.slice(0, s) + text + editor.value.slice(e)
    editor.selectionStart = editor.selectionEnd = s + text.length
    editor.focus()
    setDirty(true)
  }

  // ── Context menu ───────────────────────────────────────

  const ctxMenu = document.getElementById('ctx-menu')

  function showCtxMenu(x, y) {
    ctxMenu.style.left = x + 'px'
    ctxMenu.style.top  = y + 'px'
    ctxMenu.style.display = 'block'
    // keep menu within viewport
    const r = ctxMenu.getBoundingClientRect()
    if (r.right  > window.innerWidth)  ctxMenu.style.left = (x - r.width)  + 'px'
    if (r.bottom > window.innerHeight) ctxMenu.style.top  = (y - r.height) + 'px'
  }

  function hideCtxMenu() { ctxMenu.style.display = 'none' }

  editor.addEventListener('contextmenu', e => {
    if (!currentPath) return
    e.preventDefault()
    showCtxMenu(e.clientX, e.clientY)
  })

  document.addEventListener('click', hideCtxMenu)
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { hideCtxMenu(); closeModal() } })

  ctxMenu.querySelectorAll('.ctx-item').forEach(item => {
    item.addEventListener('click', e => {
      e.stopPropagation()
      hideCtxMenu()
      const action = item.dataset.action
      if (action === 'internal-link') openInternalLinkModal()
      else if (action === 'external-link') openExternalLinkModal()
      else if (action === 'doc-link') openDocLinkModal()
      else if (action === 'image') openImageModal()
      else if (action === 'carousel') openCarouselModal()
    })
  })

  // ── Modal system ───────────────────────────────────────

  const modalOverlay  = document.getElementById('modal-overlay')
  const modalTitle    = document.getElementById('modal-title')
  const modalBody     = document.getElementById('modal-body')
  const modalInsertBtn = document.getElementById('modal-insert-btn')
  const modalCancelBtn = document.getElementById('modal-cancel-btn')
  const modalCloseBtn  = document.getElementById('modal-close-btn')

  let modalInsertHandler = null

  function openModal(title, bodyHtml, onInsert) {
    modalTitle.textContent = title
    modalBody.innerHTML = bodyHtml
    modalInsertHandler = onInsert
    modalOverlay.classList.add('open')
  }

  function closeModal() {
    modalOverlay.classList.remove('open')
    modalBody.innerHTML = ''
    modalInsertHandler = null
  }

  modalInsertBtn.addEventListener('click', () => {
    if (modalInsertHandler) {
      const text = modalInsertHandler()
      if (text !== null) { insertAtCursor(text); closeModal() }
    }
  })
  modalCancelBtn.addEventListener('click', closeModal)
  modalCloseBtn.addEventListener('click', closeModal)
  modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal() })

  // ── Modal: External link ───────────────────────────────

  function openExternalLinkModal() {
    openModal('Посилання на зовнішній сайт', `
      <div class="mfield">
        <label>URL</label>
        <input id="ml-url" class="minput" type="url" placeholder="https://..." />
      </div>
      <div class="mfield">
        <label>Текст посилання</label>
        <input id="ml-text" class="minput" type="text" placeholder="Назва посилання" />
      </div>
    `, () => {
      const url  = document.getElementById('ml-url').value.trim()
      const text = document.getElementById('ml-text').value.trim() || url
      if (!url) return null
      return `[${text}](${url})`
    })
    setTimeout(() => document.getElementById('ml-url')?.focus(), 50)
  }

  // ── Modal: Internal link ───────────────────────────────

  async function openInternalLinkModal() {
    openModal('Посилання на сторінку сайту', `
      <input class="picker-search" id="ml-page-search" placeholder="Пошук сторінки..." />
      <div class="picker-list" id="ml-page-list"><div style="padding:10px;color:#6c7086">Завантаження...</div></div>
      <div class="mfield">
        <label>Текст посилання</label>
        <input id="ml-page-text" class="minput" type="text" placeholder="Назва посилання" />
      </div>
    `, () => {
      const sel = modalBody.querySelector('.picker-item.selected')
      if (!sel) return null
      const relPath = sel.dataset.path
      const text = document.getElementById('ml-page-text').value.trim() || sel.dataset.title
      return `[${text}](${relPath})`
    })

    const pages = await window.api.getAllPages()
    const list = document.getElementById('ml-page-list')
    if (!list) return

    const render = (items) => {
      list.innerHTML = items.length
        ? items.map(p => `
            <div class="picker-item" data-path="${p.relativePath}" data-title="${p.title}">
              <div class="picker-item-title">${p.title}</div>
              <div class="picker-item-path">${p.relativePath}</div>
            </div>`).join('')
        : '<div style="padding:10px;color:#6c7086">Нічого не знайдено</div>'

      list.querySelectorAll('.picker-item').forEach(item => {
        item.addEventListener('click', () => {
          list.querySelectorAll('.picker-item').forEach(i => i.classList.remove('selected'))
          item.classList.add('selected')
          const textInput = document.getElementById('ml-page-text')
          if (textInput && !textInput.value) textInput.value = item.dataset.title
        })
      })
    }

    render(pages)

    const search = document.getElementById('ml-page-search')
    search?.addEventListener('input', () => {
      const q = search.value.toLowerCase()
      render(pages.filter(p => p.title.toLowerCase().includes(q) || p.relativePath.toLowerCase().includes(q)))
    })
    setTimeout(() => search?.focus(), 50)
  }

  // ── Modal: Document link ───────────────────────────────

  function documentLinkHref(relativePath) {
    const cleanPath = String(relativePath || '').replace(/\\/g, '/').replace(/^\/+/, '')
    const encodedPath = cleanPath
      .split('/')
      .map(part => part
        .replace(/%/g, '%25')
        .replace(/ /g, '%20')
        .replace(/\(/g, '%28')
        .replace(/\)/g, '%29')
        .replace(/#/g, '%23')
        .replace(/\?/g, '%3F'))
      .join('/')
    return `../../${encodedPath}`
  }

  async function openDocLinkModal() {
    openModal('Посилання на документ', `
      <input class="picker-search" id="ml-doc-search" placeholder="Пошук документу..." />
      <div class="picker-list" id="ml-doc-list"><div style="padding:10px;color:#6c7086">Завантаження...</div></div>
      <div class="drop-zone" id="ml-doc-drop">
        <span>Перетягніть файли сюди →</span>
        <select id="ml-doc-drop-dir"></select>
      </div>
      <div class="mfield">
        <label>Текст посилання</label>
        <input id="ml-doc-text" class="minput" type="text" placeholder="Назва документу" />
      </div>
    `, () => {
      const sel = modalBody.querySelector('.picker-item.selected')
      if (!sel) return null
      const text = document.getElementById('ml-doc-text').value.trim() || sel.dataset.name
      return `[${text}](${documentLinkHref(sel.dataset.path)})`
    })

    let docs = await window.api.listAllDocuments()
    const list = document.getElementById('ml-doc-list')
    if (!list) return

    const render = (items) => {
      list.innerHTML = items.length
        ? items.map(d => `
            <div class="picker-item" data-path="${d.relativePath}" data-name="${d.name}">
              <div class="picker-item-title">${d.name}</div>
              <div class="picker-item-path">${d.dir}/</div>
            </div>`).join('')
        : '<div style="padding:10px;color:#6c7086">Нічого не знайдено</div>'

      list.querySelectorAll('.picker-item').forEach(item => {
        item.addEventListener('click', () => {
          list.querySelectorAll('.picker-item').forEach(i => i.classList.remove('selected'))
          item.classList.add('selected')
          const textInput = document.getElementById('ml-doc-text')
          if (textInput && !textInput.value) textInput.value = item.dataset.name
        })
      })
    }

    render(docs)

    document.getElementById('ml-doc-search')?.addEventListener('input', e => {
      const q = e.target.value.toLowerCase()
      render(docs.filter(d => d.name.toLowerCase().includes(q)))
    })

    setupDropZone('ml-doc-drop', 'ml-doc-drop-dir', 'document', async () => {
      docs = await window.api.listAllDocuments()
      render(docs)
    })

    setTimeout(() => document.getElementById('ml-doc-search')?.focus(), 50)
  }

  // ── Modal: Image ───────────────────────────────────────

  async function openImageModal() {
    openModal('Зображення', `
      <input class="picker-search" id="ml-img-search" placeholder="Пошук зображення..." />
      <div class="img-grid" id="ml-img-grid"><div style="color:#6c7086;padding:8px">Завантаження...</div></div>
      <div class="drop-zone" id="ml-img-drop">
        <span>Перетягніть зображення сюди →</span>
        <select id="ml-img-drop-dir"></select>
      </div>
      <div class="mfield">
        <label>Підпис (необов'язково)</label>
        <input id="ml-img-caption" class="minput" type="text" placeholder="Підпис до зображення" />
      </div>
    `, () => {
      const sel = document.querySelector('.img-grid-item.selected')
      if (!sel) return null
      const caption = document.getElementById('ml-img-caption').value.trim()
      const src = '/' + sel.dataset.rel
      return caption
        ? `{{< images src="${src}" caption="${caption}" >}}{{< /images >}}`
        : `{{< images src="${src}" >}}{{< /images >}}`
    })

    let images = await window.api.listAllImages()
    renderImageGrid('ml-img-grid', images, false)

    document.getElementById('ml-img-search')?.addEventListener('input', e => {
      const q = e.target.value.toLowerCase()
      renderImageGrid('ml-img-grid', images.filter(i => i.name.toLowerCase().includes(q)), false)
    })

    setupDropZone('ml-img-drop', 'ml-img-drop-dir', 'image', async () => {
      images = await window.api.listAllImages()
      renderImageGrid('ml-img-grid', images, false)
    })
  }

  // ── Modal: Carousel ────────────────────────────────────

  async function openCarouselModal() {
    openModal('Карусель зображень', `
      <input class="picker-search" id="ml-car-search" placeholder="Пошук зображення..." />
      <div class="img-grid" id="ml-car-grid"><div style="color:#6c7086;padding:8px">Завантаження...</div></div>
      <div class="drop-zone" id="ml-car-drop">
        <span>Перетягніть зображення сюди →</span>
        <select id="ml-car-drop-dir"></select>
      </div>
      <div id="ml-car-selected" class="carousel-selected" style="margin-top:4px"></div>
    `, () => {
      const items = [...document.querySelectorAll('.carousel-selected-item')]
      if (!items.length) return null
      const lines = items.map(item => {
        const rel = item.dataset.rel
        const cap = item.querySelector('.carousel-caption-input').value.trim()
        return cap ? `${rel} | ${cap}` : rel
      })
      return `{{< images >}}\n${lines.join('\n')}\n{{< /images >}}`
    })

    let images = await window.api.listAllImages()
    renderImageGrid('ml-car-grid', images, true)

    document.getElementById('ml-car-search')?.addEventListener('input', e => {
      const q = e.target.value.toLowerCase()
      renderImageGrid('ml-car-grid', images.filter(i => i.name.toLowerCase().includes(q)), true)
    })

    setupDropZone('ml-car-drop', 'ml-car-drop-dir', 'image', async () => {
      images = await window.api.listAllImages()
      renderImageGrid('ml-car-grid', images, true)
    })
  }

  // ── Image grid renderer ────────────────────────────────

  function renderImageGrid(gridId, images, multiSelect) {
    const grid = document.getElementById(gridId)
    if (!grid) return
    grid.innerHTML = ''

    // Group by group field (subfolder name)
    const byGroup = {}
    for (const img of images) {
      if (!byGroup[img.group]) byGroup[img.group] = []
      byGroup[img.group].push(img)
    }

    for (const [group, imgs] of Object.entries(byGroup)) {
      const lbl = document.createElement('div')
      lbl.className = 'img-dir-label'
      lbl.textContent = group
      grid.appendChild(lbl)

      for (const img of imgs) {
        const item = document.createElement('div')
        item.className = 'img-grid-item'
        item.dataset.rel = img.relativePath
        item.dataset.dataUrl = img.dataUrl || ''
        item.innerHTML = `
          <img src="${img.dataUrl || ''}" alt="${img.name}" title="${img.name}" />
          <div class="img-check">✓</div>
        `

        item.addEventListener('click', () => {
          if (multiSelect) {
            item.classList.toggle('selected')
            syncCarouselSelected()
          } else {
            grid.querySelectorAll('.img-grid-item').forEach(i => i.classList.remove('selected'))
            item.classList.add('selected')
          }
        })

        grid.appendChild(item)
      }
    }

    if (!images.length) {
      grid.innerHTML = '<div style="color:#6c7086;padding:8px">Нічого не знайдено</div>'
    }
  }

  // ── Drop zone helper ──────────────────────────────────
  // zoneId     — id of the .drop-zone element
  // selectId   — id of the <select> inside the zone for choosing the target subdir
  // type       — 'image' | 'document'
  // onDropped  — async callback called after files are copied; should reload the list

  async function setupDropZone(zoneId, selectId, type, onDropped) {
    const zone = document.getElementById(zoneId)
    const sel  = document.getElementById(selectId)
    if (!zone || !sel) return

    const mediaConfig = await window.api.getMediaConfig()
    const dirs = type === 'image' ? mediaConfig.images : mediaConfig.documents

    if (!dirs.length) { zone.style.display = 'none'; return }

    if (dirs.length === 1) {
      sel.style.display = 'none'
    } else {
      dirs.forEach(d => {
        const opt = document.createElement('option')
        opt.value = opt.textContent = d
        sel.appendChild(opt)
      })
    }

    const getDir = () => dirs.length === 1 ? dirs[0] : sel.value

    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over') })
    zone.addEventListener('dragleave', e => { if (!zone.contains(e.relatedTarget)) zone.classList.remove('drag-over') })
    zone.addEventListener('drop', async e => {
      e.preventDefault()
      zone.classList.remove('drag-over')
      const files = [...e.dataTransfer.files]
      if (!files.length) return
      const dir = getDir()
      let ok = 0, fail = 0
      for (const file of files) {
        const filePath = window.api.getPathForFile(file)
        const res = await window.api.copyMediaFile(filePath, type, dir)
        res.ok ? ok++ : fail++
      }
      if (ok)   showToast(`Скопійовано: ${ok} файл(ів)`, 'ok')
      if (fail) showToast(`Помилка копіювання: ${fail} файл(ів)`, 'error')
      if (ok) await onDropped()
    })
  }

  function syncCarouselSelected() {
    const container = document.getElementById('ml-car-selected')
    if (!container) return

    const selectedItems = [...document.querySelectorAll('#ml-car-grid .img-grid-item.selected')]

    // Remove deselected
    container.querySelectorAll('.carousel-selected-item').forEach(row => {
      if (!selectedItems.find(i => i.dataset.rel === row.dataset.rel)) row.remove()
    })

    // Add newly selected
    for (const item of selectedItems) {
      if (container.querySelector(`[data-rel="${item.dataset.rel}"]`)) continue
      const row = document.createElement('div')
      row.className = 'carousel-selected-item'
      row.dataset.rel = item.dataset.rel
      row.innerHTML = `
        <img class="carousel-selected-thumb" src="${item.dataset.dataUrl}" alt="" />
        <span class="carousel-selected-name">${item.dataset.rel.split('/').pop()}</span>
        <input class="carousel-caption-input" placeholder="Підпис..." />
        <button class="carousel-remove" title="Видалити">×</button>
      `
      row.querySelector('.carousel-remove').addEventListener('click', () => {
        row.remove()
        // deselect in grid
        const gridItem = document.querySelector(`#ml-car-grid .img-grid-item[data-rel="${item.dataset.rel}"]`)
        gridItem?.classList.remove('selected')
      })
      container.appendChild(row)
    }
  }

  // ── Init ───────────────────────────────────────────────

  async function init() {
    const cfgPath = await window.api.getConfigPath()
    document.getElementById('sidebar-header').title = 'Config: ' + cfgPath
    await buildTree()
  }

  init()

  // ── Toast ───────────────────────────────────────────────

  let toastTimer = null
  function showToast(msg, type = 'ok') {
    const t = document.getElementById('toast')
    t.textContent = msg
    t.className = `show toast-${type}`
    clearTimeout(toastTimer)
    toastTimer = setTimeout(() => { t.className = '' }, 3500)
  }

  // ── Git Pull ────────────────────────────────────────────

  document.getElementById('btn-pull').addEventListener('click', async () => {
    const btn = document.getElementById('btn-pull')
    btn.disabled = true
    btn.textContent = '…'
    const res = await window.api.gitPull()
    btn.disabled = false
    btn.textContent = '↓ Pull'
    if (res.error || !res.ok) {
      showToast('Pull помилка:\n' + (res.error || res.stderr).trim(), 'error')
    } else {
      const detail = (res.stdout || res.stderr || '').trim()
      const label = res.cloned ? 'Клонування успішно' : 'Pull успішно'
      showToast(label + (detail ? ':\n' + detail : ''), 'ok')
      buildTree()
    }
  })

  // ── Commit + Push ───────────────────────────────────────

  document.getElementById('btn-commit').addEventListener('click', openCommitModal)

  function openCommitModal() {
    openModal('Commit та Push', `
      <div class="mfield">
        <label>Повідомлення коміту</label>
        <input id="ml-commit-msg" class="minput" type="text"
               placeholder="Оновлення контенту сайту" />
      </div>
    `, async () => {
      const msg = document.getElementById('ml-commit-msg').value.trim()
      if (!msg) return null
      closeModal()
      const btn = document.getElementById('btn-commit')
      btn.disabled = true
      btn.textContent = '…'
      const res = await window.api.gitCommitPush(msg)
      btn.disabled = false
      btn.textContent = '↑ Push'
      if (res.error || !res.ok) {
        showToast('Push помилка:\n' + (res.error || '').trim(), 'error')
      } else {
        showToast('Push успішно!', 'ok')
      }
      return null
    })
    setTimeout(() => document.getElementById('ml-commit-msg')?.focus(), 50)
  }

  // ── Hugo Server ─────────────────────────────────────────

  let hugoRunning = false

  window.api.onHugoOutput(({ type, text }) => {
    if (type === 'exit' || type === 'error') {
      hugoRunning = false
      updateHugoBtn()
      if (type === 'error') showToast('Hugo помилка:\n' + text, 'error')
    }
    if ((type === 'stdout' || type === 'stderr') && /localhost|127\.0\.0\.1/.test(text)) {
      document.getElementById('hugo-status').classList.add('visible')
    }
  })

  document.getElementById('hugo-open-link').addEventListener('click', () => {
    window.api.openExternal('http://localhost:1313')
  })

  document.getElementById('btn-hugo').addEventListener('click', async () => {
    if (hugoRunning) {
      await window.api.hugoServerStop()
      hugoRunning = false
    } else {
      const res = await window.api.hugoServerStart()
      if (res.error) { showToast('Hugo: ' + res.error, 'error'); return }
      hugoRunning = true
    }
    updateHugoBtn()
  })

  function updateHugoBtn() {
    const btn = document.getElementById('btn-hugo')
    btn.textContent = hugoRunning ? '■ Hugo' : '▶ Hugo'
    btn.classList.toggle('tb-active', hugoRunning)
    if (!hugoRunning) {
      document.getElementById('hugo-status').classList.remove('visible')
    }
  }
</script>
</body>
</html>
